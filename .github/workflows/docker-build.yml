name: Docker Build & Push

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/api
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # Build and push API Docker image
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Start Stack
        run: docker compose up -d --build

      - name: Wait for Services to be Healthy
        run: |
          for i in $(seq 1 30); do
            unhealthy=$(docker compose ps --format json | jq -r 'select(.Health=="unhealthy") | .Name')
            starting=$(docker compose ps --format json | jq -r 'select(.Health=="starting") | .Name')
            if [-n "$unhealthy"]; then echo "Unhealthy Services: $unhealthy"; exit 1; fi
            if [-n "$starting"]; then echo "All Healthy, Starting Services: $starting"; exit 0; fi
            sleep 10

          done
          echo "Timed Out"; docker compose ps; docker compose logs; exit 1
      - name: Dump Logs on Failure
        if: failure()
        run: docker compose logs
        
      - name: Stop Services
        if: failure()
        run: docker compose down -v
        
